<script>
document.addEventListener("DOMContentLoaded", function () {
  document.querySelectorAll("div.prompt").forEach(function (d, i) {
    var pre = d.querySelector("pre"); if (!pre) return;
    var b = document.createElement("button"); b.type = "button"; b.className = "copy-prompt"; b.textContent = "Copy prompt";
    b.setAttribute("aria-label", "Copy this prompt to the clipboard");
    b.addEventListener("click", function () {
      var t = pre.innerText; var done = function () { b.textContent = "Copied"; setTimeout(function () { b.textContent = "Copy prompt"; }, 1400); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done, function () { fallback(t, done); }); else fallback(t, done);
    });
    d.insertBefore(b, d.firstChild);
  });
  function fallback(t, done) { var a = document.createElement("textarea"); a.value = t; document.body.appendChild(a); a.select(); try { document.execCommand("copy"); } catch (e) {} a.remove(); done(); }
});
</script>
